<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{width:420px;max-height:520px;margin:0;padding:8px;font:12px monospace;background:#1e1e1e;color:#d4d4d4;overflow-y:auto}
h3{margin:4px 0;color:#569cd6}
button{background:#264f78;color:#fff;border:none;padding:4px 12px;cursor:pointer;border-radius:3px;margin-bottom:6px}
button:hover{background:#37699e}
label{display:block;margin:8px 0 4px}
.toggle{display:flex;align-items:center;gap:6px;margin:8px 0}
.toggle input{margin:0}
pre{white-space:pre-wrap;word-break:break-all;margin:0;padding:6px;background:#252526;border-radius:3px;max-height:420px;overflow-y:auto}
</style>
</head>
<body>
<h3 data-i18n="extensionName"></h3>
<label class="toggle" for="indicator-visible">
  <input id="indicator-visible" type="checkbox">
  <span data-i18n="indicatorToggleLabel"></span>
</label>
<div data-i18n="cookieViewerTitle"></div>
<button id="refresh" data-i18n="refreshButton"></button>
<pre id="out" data-i18n="cookieViewerInitial"></pre>
<script src="popup.js"></script>
</body>
</html>
